<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POWERDIGGER Library</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e1a;
    --surface: #16182a;
    --surface2: #1e2035;
    --border: #2a2d4a;
    --accent: #4a90d9;
    --accent-dim: rgba(74,144,217,0.15);
    --text: #e0e0ff;
    --text-dim: #8888aa;
    --danger: #e05555;
    --radius: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--accent);
    flex: 1;
  }
  #search-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 6px 12px;
    font-size: 13px;
    width: 220px;
    outline: none;
  }
  #search-input:focus { border-color: var(--accent); }
  #search-input::placeholder { color: var(--text-dim); }

  /* ── Layout ── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 12px 14px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  #btn-new-folder {
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
  }
  #btn-new-folder:hover { background: var(--accent-dim); }

  #folder-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  #folder-list::-webkit-scrollbar { width: 4px; }
  #folder-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .folder-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    cursor: pointer;
    border-radius: 0;
    user-select: none;
    position: relative;
  }
  .folder-item:hover { background: var(--accent-dim); }
  .folder-item.active { background: var(--accent-dim); border-left: 3px solid var(--accent); padding-left: 11px; }
  .folder-item.drag-over { background: rgba(74,144,217,0.35); }

  .folder-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .folder-name {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 13px;
  }
  .folder-count {
    font-size: 11px;
    color: var(--text-dim);
    background: var(--surface2);
    border-radius: 10px;
    padding: 1px 6px;
    flex-shrink: 0;
  }
  .folder-drag-handle {
    cursor: grab;
    color: var(--text-dim);
    font-size: 11px;
    padding: 0 2px;
  }
  .folder-drag-handle:active { cursor: grabbing; }

  /* ── Track panel ── */
  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 14px 20px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .panel-header h2 {
    flex: 1;
    font-size: 15px;
    font-weight: 700;
  }
  #btn-rename-folder, #btn-delete-folder, #btn-color-folder {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 4px;
    padding: 3px 8px;
    cursor: pointer;
    font-size: 12px;
  }
  #btn-rename-folder:hover { border-color: var(--accent); color: var(--accent); }
  #btn-delete-folder:hover { border-color: var(--danger); color: var(--danger); }
  #btn-color-folder:hover { border-color: var(--accent); color: var(--accent); }
  #folder-color-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  #color-picker-input {
    width: 0; height: 0; opacity: 0; position: absolute;
  }

  #track-list-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 10px 16px;
  }
  #track-list-wrap::-webkit-scrollbar { width: 4px; }
  #track-list-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .empty-state {
    color: var(--text-dim);
    text-align: center;
    margin-top: 60px;
    font-size: 14px;
    line-height: 2;
  }
  .empty-state .big { font-size: 36px; }

  /* ── Track card ── */
  .track-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: var(--radius);
    background: var(--surface);
    margin-bottom: 6px;
    border: 1px solid var(--border);
    transition: border-color 0.15s;
    cursor: default;
  }
  .track-card:hover { border-color: var(--accent); }
  .track-card.drag-ghost { opacity: 0.4; }

  .track-info { flex: 1; overflow: hidden; }
  .track-title {
    font-weight: 600;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-sub {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  .track-date {
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .track-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-visit {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 4px;
    padding: 3px 8px;
    cursor: pointer;
    font-size: 11px;
    text-decoration: none;
    display: inline-block;
  }
  .btn-visit:hover { border-color: var(--accent); color: var(--accent); }
  .btn-move {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 4px;
    padding: 3px 8px;
    cursor: pointer;
    font-size: 11px;
    position: relative;
  }
  .btn-move:hover { border-color: var(--accent); color: var(--accent); }
  .btn-remove {
    background: none;
    border: 1px solid transparent;
    color: var(--text-dim);
    border-radius: 4px;
    padding: 3px 6px;
    cursor: pointer;
    font-size: 14px;
  }
  .btn-remove:hover { border-color: var(--danger); color: var(--danger); }

  /* Move dropdown */
  .move-menu {
    position: absolute;
    right: 0; top: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    z-index: 100;
    min-width: 150px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  .move-menu-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text);
  }
  .move-menu-item:hover { background: var(--accent-dim); }

  /* Sort bar */
  .sort-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 20px 10px;
    font-size: 12px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .sort-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 4px;
    padding: 2px 8px;
    cursor: pointer;
    font-size: 11px;
  }
  .sort-btn.active { border-color: var(--accent); color: var(--accent); }
  .sort-btn:hover { border-color: var(--accent); }

  /* No folder selected */
  .no-selection {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
    font-size: 15px;
    flex-direction: column;
    gap: 10px;
  }
  .no-selection .big { font-size: 48px; }
</style>
</head>
<body>

<header>
  <h1>⚡ POWERDIGGER Library</h1>
  <input id="search-input" type="text" placeholder="Search tracks…" />
</header>

<div class="main">
  <!-- Sidebar: folder list -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span>Folders</span>
      <button id="btn-new-folder" title="New folder">+</button>
    </div>
    <div id="folder-list"></div>
  </aside>

  <!-- Main panel: track list -->
  <div class="panel" id="panel">
    <div class="no-selection" id="no-selection">
      <span class="big">📁</span>
      <span>Select a folder</span>
    </div>

    <div id="folder-view" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
      <div class="panel-header">
        <span id="folder-color-dot"></span>
        <h2 id="panel-folder-name"></h2>
        <button id="btn-color-folder" title="Change colour">🎨</button>
        <input type="color" id="color-picker-input" />
        <button id="btn-rename-folder">Rename</button>
        <button id="btn-delete-folder">Delete</button>
      </div>
      <div class="sort-bar">
        Sort:
        <button class="sort-btn active" data-sort="added">Date added</button>
        <button class="sort-btn" data-sort="title">Title</button>
        <button class="sort-btn" data-sort="artist">Artist</button>
      </div>
      <div id="track-list-wrap">
        <div id="track-list"></div>
      </div>
    </div>
  </div>
</div>

<script src="library.js"></script>
</body>
</html>
